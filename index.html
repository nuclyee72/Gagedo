<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" id="theme-color-meta" content="#ffffff">
<title>가계도 메이커</title>
<link rel="stylesheet" href="style.css">
<script>
  // CSS/앱 스크립트가 뜨기 전에 테마부터 정해서, 다크 모드 사용자가 밝은 화면을 잠깐이라도
  // 보는 깜빡임(FOUC)을 막는다. 저장된 값이 없으면 OS/브라우저의 다크 모드 설정을 따른다.
  (function () {
    try {
      var stored = localStorage.getItem("gagedo-theme");
      var theme = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      // 모바일 브라우저 상단 상태 표시줄 색도 처음부터 테마에 맞춰서(안 그러면 다크 모드에서도
      // 잠깐 흰 상태줄이 보였다가 바뀐다) — 실제 값은 main.js의 applyTheme이 계속 관리한다.
      var themeMeta = document.getElementById("theme-color-meta");
      if (themeMeta) themeMeta.content = theme === "dark" ? "#1c2028" : "#ffffff";
    } catch (e) { /* localStorage 접근 불가(예: 완전 차단된 시크릿 모드)면 기본(라이트)으로 둔다 */ }
  })();
</script>
</head>
<body>
  <div id="app">
    <header id="toolbar"></header>

    <main id="viewport">
      <div id="stage">
        <svg id="lines-layer"></svg>
        <div id="world"></div>
      </div>
      <div id="empty-hint">
        <p>아직 등록된 인물이 없어요.</p>
        <p>왼쪽 위 <strong>“+ 인물 추가”</strong> 버튼으로 가계도를 시작해보세요.</p>
      </div>
    </main>

    <aside id="inspector"></aside>

    <div id="trash-drop" aria-hidden="true">🗑️</div>

    <div id="crop-modal" class="modal-overlay">
      <div class="modal-box crop-modal-box">
        <h3>사진 위치·크기 조정</h3>
        <div class="crop-canvas-wrap">
          <canvas id="crop-canvas" width="280" height="280"></canvas>
        </div>
        <input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1" aria-label="확대/축소">
        <div class="crop-modal-actions">
          <button type="button" data-action="crop-cancel">취소</button>
          <button type="button" class="primary" data-action="crop-apply">적용</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
